synopsys.Spanish=Una foto con una anomalía lleva a Darrell al cementerio de Arkham.
synopsys.English=A photo with an anomaly leads Darrell to the Arkham cemetery.
description.Spanish=El revelado de una foto que presentaba una anomalía de origen desconocido desconcierta a Darrell, que inmediatamente se pone en marcha para averiguar qué está pasando y, claro está, conseguir una buena historia para el periódico.\n\n--------------------------------------------------------------------\nSexto escenario del proyecto "Historias de Arkham". Es necesario jugar obligatoriamente con Darrell Simmons.\n--------------------------------------------------------------------\nEste escenario usa los monstruos y tableros, así como al investigador Darrell Simmons, todos componentes de la expansión de la primera edición "Alquimia Prohibida" (o su equivalente de la segunda edición, "Recuerdos suprimidos"). También se usan los módulos de tablero "Parcela 2" y "Dormitorio 1" de la segunda edición.\n\nTamaño máximo del mapa: 3x2 tableros cuadrados.
description.English=The development of a photograph that revealed an anomaly of unknown origin baffles Darrell, who immediately sets out to find out what's going on and, of course, get a good story for the newspaper. \n\n -------------------------------------------------------------------- \n Sixth scenario of the "Arkham Stories" project. It is mandatory to play as Darrell Simmons. \n -------------------------------------------------------------------- \n This scenario uses the monsters and tiles, as well as the investigator Darrell Simmons, all components of the first edition expansion "Forbidden Alchemy" (or its second edition equivalent, "Suppressed Memories"). The second edition board modules "Yard 2" and "Bedroom 1" are also used. \n\n Maximum map size: 3x2 square tiles.
